name: CTO P1 Security Gate Audit & Provenance Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Execute CTO Security Audit & Bind Evidence to Commit SHA
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_boontrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      ENV: test
      ENVIRONMENT: test
      BOONTRACK_ENV: test
      TEST_STRICT_DB_GUARD: "1"
      TEST_REQUIRE_DISPOSABLE_SERVICES: "1"
      ENABLE_LOCAL_REDIS: "true"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_boontrack
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/test_boontrack
      STAGE1_TEST_DISPOSABLE_PG_DSN: postgresql://test_user:test_password@127.0.0.1:5432/bt_stage1_disposable_test_stage1
      STAGE3_STEP0_DISPOSABLE_PG_DSN: postgresql://test_user:test_password@127.0.0.1:5432/bt_stage1_disposable_test_step0
      STAGE3_STEP1_DISPOSABLE_PG_DSN: postgresql://test_user:test_password@127.0.0.1:5432/bt_stage1_disposable_test_step1
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_URL: redis://127.0.0.1:6379/0
      XENDIT_SECRET_KEY: test_ci_xendit_secret_key_mock_12345
      XENDIT_CALLBACK_TOKEN: test_ci_xendit_callback_token_mock_12345
      XENDIT_API_URL: http://127.0.0.1:58083
      XENDIT_ENV: sandbox
      SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPECTED_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_KEY: test_ci_supabase_anon_key_mock_999
      SUPABASE_ANON_KEY: test_ci_supabase_anon_key_mock_999
      SUPABASE_SERVICE_ROLE_KEY: test_ci_supabase_service_role_key_mock_999
      STAGING_DATABASE_URL: ""
      SUPABASE_DB_URL: ""
      REVOKED_STAGING_DB_PASSWORD: ""
      RESEND_API_KEY: ""
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      EMAIL_FROM: noreply@test.boontrack.invalid
      BOONTRACK_HMAC_SECRET: test_ci_secure_hmac_secret_for_pipeline_999
      EVOLUTION_API_KEY: test_ci_evolution_api_key_placeholder
      EVOLUTION_API_URL: http://127.0.0.1:58080
      WA_GATEWAY_BASE_URL: http://127.0.0.1:58080
      WAHA_API_KEY: ""
      WHATSAPP_TOKEN: ""
      META_SYSTEM_USER_TOKEN: ""
      WABA_ACCESS_TOKEN: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CREATOR_BOT_TOKEN: ""
      TELEGRAM_ONLINEBOOST_BOT_TOKEN: ""
      BITESHIP_API_KEY: ""
      BITESHIP_BASE_URL: http://127.0.0.1:58082
      DUITKU_API_KEY: ""
      LLM_PROVIDER: mock
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
      R2_ACCESS_KEY_ID: test_ci_r2_access_key
      R2_SECRET_ACCESS_KEY: test_ci_r2_secret_key
      R2_ACCOUNT_ID: test-ci-r2-account
      R2_ENDPOINT: http://127.0.0.1:59000
      R2_ENDPOINT_URL: http://127.0.0.1:59000
      R2_PUBLIC_DOMAIN: http://127.0.0.1:59000
      CI: "true"

    steps:
      - name: Checkout Code at Exact Commit SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install --prefer-binary -r requirements.txt; fi
          pip install --no-deps aiogram==2.25.2
          pip install pytest pytest-asyncio pytest-cov

      - name: Verify Tested Commit SHA Provenance
        run: |
          echo "========================================================"
          echo "PROVENANCE AUDIT SUMMARY"
          echo "--------------------------------------------------------"
          echo "Event Name:                       ${{ github.event_name }}"
          echo "GITHUB_SHA (Action Event SHA):    ${{ github.sha }}"
          echo "PR Head SHA (Authorized Commit):  ${{ github.event.pull_request.head.sha }}"
          echo "PR Base SHA (Target Branch SHA):  ${{ github.event.pull_request.base.sha }}"
          echo "Actual Checked-out Ref:           $(git symbolic-ref -q HEAD || git describe --all --always HEAD)"
          echo "Actual Tested Commit (git HEAD):  $(git rev-parse HEAD)"
          echo "Working Tree Status:              $(git status --porcelain)"
          echo "--------------------------------------------------------"
          echo "Provenance Classification:"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "1. PR Head Commit (Branch Under Test):  ${{ github.event.pull_request.head.sha }}"
            echo "2. Synthetic Merge Commit (Merge Ref):  ${{ github.sha }}"
            echo "3. Tested Working Tree Commit:          $(git rev-parse HEAD)"
          else
            echo "Direct Push / Dispatch Commit:          ${{ github.sha }}"
          fi
          echo "========================================================"

      - name: Enforce Kernel Network Egress Isolation & DNS Sinkhole
        run: |
          set -euo pipefail

          echo "=== 1. Runtime Detection of Docker Service Container Subnets ==="
          PG_CONTAINER=$(docker ps --filter "ancestor=postgres:15" -q | head -n 1)
          REDIS_CONTAINER=$(docker ps --filter "ancestor=redis:7-alpine" -q | head -n 1)

          if [ -z "$PG_CONTAINER" ] || [ -z "$REDIS_CONTAINER" ]; then
            PG_CONTAINER=$(docker ps --format '{{.ID}} {{.Image}}' | grep -i postgres | awk '{print $1}' | head -n 1)
            REDIS_CONTAINER=$(docker ps --format '{{.ID}} {{.Image}}' | grep -i redis | awk '{print $1}' | head -n 1)
          fi

          if [ -z "$PG_CONTAINER" ] || [ -z "$REDIS_CONTAINER" ]; then
            echo "❌ FAIL-CLOSED: PostgreSQL or Redis service container not detected at runtime." >&2
            docker ps -a
            exit 1
          fi

          PG_NETS=$(docker inspect "$PG_CONTAINER" --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' | grep -v '^$')
          REDIS_NETS=$(docker inspect "$REDIS_CONTAINER" --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' | grep -v '^$')
          SERVICE_NETS=$(printf "%s\n%s\n" "$PG_NETS" "$REDIS_NETS" | sort -u | grep -v '^$')

          if [ -z "$SERVICE_NETS" ]; then
            echo "❌ FAIL-CLOSED: No network found for PostgreSQL/Redis service containers." >&2
            exit 1
          fi

          DOCKER_SERVICE_SUBNETS=()
          for net in $SERVICE_NETS; do
            subnet=$(docker network inspect "$net" --format '{{range .IPAM.Config}}{{.Subnet}}{{"\n"}}{{end}}' | grep -v '^$' | head -n 1)
            if [[ -z "$subnet" || ! "$subnet" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+$ ]]; then
              echo "❌ FAIL-CLOSED: Invalid or missing subnet for Docker service network '''$net''': '''$subnet'''" >&2
              exit 1
            fi
            DOCKER_SERVICE_SUBNETS+=("$subnet")
          done

          DOCKER_SERVICE_SUBNETS=($(printf "%s\n" "${DOCKER_SERVICE_SUBNETS[@]}" | sort -u))
          if [ ${#DOCKER_SERVICE_SUBNETS[@]} -eq 0 ]; then
            echo "❌ FAIL-CLOSED: Zero valid Docker service subnets detected." >&2
            exit 1
          fi

          echo "Detected PostgreSQL Container: $PG_CONTAINER"
          echo "Detected Redis Container:      $REDIS_CONTAINER"
          echo "Detected Service Networks:     $SERVICE_NETS"
          echo "Detected Service Subnets:      ${DOCKER_SERVICE_SUBNETS[*]}"

          echo "=== 2. Apply DNS Sinkhole and Host-Specific Egress Blocks ==="
          BLOCKED_HOSTS=(
            "mpluzajlzpregmjwpjqr.supabase.co"
            "db.mpluzajlzpregmjwpjqr.supabase.co"
            "xkhqirhurnjqglmajghn.supabase.co"
            "db.xkhqirhurnjqglmajghn.supabase.co"
            "aws-0-ap-southeast-1.pooler.supabase.com"
            "aws-1-ap-southeast-1.pooler.supabase.com"
            "evolution-api-production-abb7.up.railway.app"
            "api.resend.com"
            "api.telegram.org"
            "graph.facebook.com"
            "api.xendit.co"
            "api.biteship.com"
          )
          for host in "${BLOCKED_HOSTS[@]}"; do
            for ip in $( (getent ahostsv4 "$host" 2>/dev/null || true) | awk '{print $1}' | sort -u ); do
              case "$ip" in
                ""|127.*) continue ;;
              esac
              sudo iptables -I OUTPUT 1 -d "$ip" -j REJECT
            done
            for ip6 in $( (getent ahostsv6 "$host" 2>/dev/null || true) | awk '{print $1}' | sort -u ); do
              case "$ip6" in
                ""|::1|::ffff:*|fe80:*) continue ;;
              esac
              sudo ip6tables -I OUTPUT 1 -d "$ip6" -j REJECT
            done
          done
          for host in "${BLOCKED_HOSTS[@]}"; do
            echo "127.0.0.1 $host" | sudo tee -a /etc/hosts >/dev/null
            echo "::1 $host" | sudo tee -a /etc/hosts >/dev/null
          done

          echo "=== 3. Add Scoped ACCEPT for Docker Service Subnets (DB/Cache Ports Only) & Block Rest ==="
          for subnet in "${DOCKER_SERVICE_SUBNETS[@]}"; do
            echo "Adding narrowly scoped ACCEPT for Docker service subnet $subnet (ports 5432,5433,6543,6379,6380)"
            sudo iptables -A OUTPUT -d "$subnet" -p tcp -m multiport --dports 5432,5433,6543,6379,6380 -j ACCEPT
            sudo iptables -A OUTPUT -d "$subnet" -p tcp -j REJECT --reject-with tcp-reset
            sudo iptables -A OUTPUT -d "$subnet" -j REJECT
          done

          echo "=== 4. Apply Non-Loopback DB/Cache and SMTP Egress REJECT Rules ==="
          sudo iptables -A OUTPUT ! -o lo ! -d 127.0.0.0/8 -p tcp -m multiport --dports 5432,5433,6543,6379,6380,25,465,587,2525 -j REJECT --reject-with tcp-reset
          sudo ip6tables -A OUTPUT ! -o lo ! -d ::1/128 -p tcp -m multiport --dports 5432,5433,6543,6379,6380,25,465,587,2525 -j REJECT

          echo "=== 5. Verify iptables OUTPUT Rules Ordering ==="
          sudo iptables -L OUTPUT -n -v --line-numbers

      - name: Verify Firewall Isolation & Egress Security Rules
        run: |
          set -euo pipefail
          python - <<'PY'
          import socket, sys, psycopg2, redis, subprocess

          def assert_blocked(host: str, port: int, desc: str) -> None:
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.settimeout(2.0)
              try:
                  s.connect((host, port))
                  s.close()
                  raise AssertionError(f"SECURITY VIOLATION: {desc} ({host}:{port}) SUCCEEDED, expected BLOCKED!")
              except (ConnectionRefusedError, socket.timeout, OSError) as e:
                  print(f"  [OK] BLOCKED: {desc} ({host}:{port}) -> {type(e).__name__}: {e}")

          print("--- 1. Testing Loopback Connectivity ---")
          s_srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s_srv.bind(("127.0.0.1", 0))
          lo_port = s_srv.getsockname()[1]
          s_srv.listen(1)
          s_cli = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s_cli.connect(("127.0.0.1", lo_port))
          s_cli.close()
          s_srv.close()
          print(f"  [OK] Loopback socket connection succeeded on port {lo_port}")

          print("--- 2. Testing PostgreSQL Service-Container Connectivity ---")
          conn = psycopg2.connect("postgresql://test_user:test_password@127.0.0.1:5432/test_boontrack", connect_timeout=5)
          cur = conn.cursor()
          cur.execute("SELECT 1;")
          assert cur.fetchone() == (1,)
          conn.close()
          print("  [OK] PostgreSQL service container connected and query returned (1,)")

          print("--- 3. Testing Redis Service-Container Connectivity ---")
          r = redis.Redis(host="127.0.0.1", port=6379, socket_timeout=5)
          assert r.ping() is True
          print("  [OK] Redis service container ping succeeded")

          print("--- 4. Testing External Egress to Representative Prohibited Destinations ---")
          assert_blocked("1.1.1.1", 5432, "External PostgreSQL port")
          assert_blocked("8.8.8.8", 6379, "External Redis port")
          assert_blocked("1.1.1.1", 6543, "External Supabase pooler port")
          assert_blocked("db.mpluzajlzpregmjwpjqr.supabase.co", 5432, "Blocked Supabase DB sinkhole")
          assert_blocked("evolution-api-production-abb7.up.railway.app", 58080, "Blocked Railway app sinkhole")

          print("--- 5. Testing SMTP Ports Blocking ---")
          for smtp_port in (25, 465, 587, 2525):
              assert_blocked("127.0.0.1", smtp_port, f"SMTP port {smtp_port} on loopback")
              assert_blocked("1.1.1.1", smtp_port, f"SMTP port {smtp_port} external")

          print("--- 6. Testing Unapproved Ports on Docker Bridge Subnet ---")
          pg_cids = subprocess.check_output(["docker", "ps", "--filter", "ancestor=postgres:15", "-q"], text=True).strip().splitlines()
          redis_cids = subprocess.check_output(["docker", "ps", "--filter", "ancestor=redis:7-alpine", "-q"], text=True).strip().splitlines()
          container_ips = []
          for cid in (pg_cids + redis_cids):
              raw_ips = subprocess.check_output(["docker", "inspect", cid, "--format", '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{"\n"}}{{end}}'], text=True)
              for ip_str in raw_ips.splitlines():
                  if ip_str.strip():
                      container_ips.append(ip_str.strip())
          container_ips = sorted(set(container_ips))
          print(f"  Detected Docker container IPs: {container_ips}")
          for c_ip in container_ips:
              assert_blocked(c_ip, 8080, f"Unapproved HTTP alt port on container {c_ip}")
              assert_blocked(c_ip, 22, f"Unapproved SSH port on container {c_ip}")
              assert_blocked(c_ip, 25, f"SMTP port 25 on container {c_ip}")
              assert_blocked(c_ip, 587, f"SMTP port 587 on container {c_ip}")

          print("\n[OK] All mandatory firewall isolation & egress security checks PASSED!")
          PY

      - name: Preflight Disposable PostgreSQL, Redis & Clean Environment
        run: |
          set -euo pipefail
          test ! -f .env
          python - <<'PY'
          import psycopg2, redis
          from app.core.security.test_isolation_guard import (
              validate_isolated_test_environment,
              verify_connected_postgres_is_disposable,
          )
          validate_isolated_test_environment()
          conn = psycopg2.connect("postgresql://test_user:test_password@127.0.0.1:5432/test_boontrack", connect_timeout=5)
          verify_connected_postgres_is_disposable(conn)
          conn.close()
          r = redis.Redis(host="127.0.0.1", port=6379, socket_timeout=5)
          assert r.ping() is True
          print("[OK] Preflight verified isolated PostgreSQL + Redis + clean CI env")
          PY

      - name: Initialize PostgreSQL Test Database Roles & RLS Schema
        run: |
          python scripts/init_test_postgres_schema.py

      - name: Run Unit Tests for Security Gates, R2 Storage, HMAC Secret, Multi-Tenant RLS, Worker Isolation, Inter-Service Contract & Meta Webhook Authentication
        run: |
          set -o pipefail
          python -m pytest tests/test_r2_tenant_authorization.py tests/test_strict_hmac_secret.py tests/test_worker_cross_tenant_isolation.py tests/test_live_postgres_rls_security.py tests/test_e2e_core_inbox_integration.py tests/test_rls_tenants_commerce_carts_attributions.py tests/test_fail_closed_config_entrypoints.py tests/test_contract_inbox_core_boundary.py tests/test_meta_webhook_verification.py tests/test_meta_webhook_p0_authentication.py -v -ra --tb=short 2>&1 | tee /tmp/test_results.log || {
            echo "## ❌ Pytest Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/test_results.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Run Dedicated Tenant Media Upload Security & Parity Test Suites
        run: |
          set -o pipefail
          python -m pytest tests/api/test_upload_security.py tests/api/test_aiohttp_upload_security.py tests/test_media_upload.py tests/api/test_upload_alias_authorization.py -v -ra --tb=short 2>&1 | tee /tmp/upload_security_test_results.log || {
            echo "## ❌ Upload Security Pytest Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/upload_security_test_results.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Execute PostgreSQL Catalog RLS & Security Invoker Audit Gate
        run: |
          set -o pipefail
          python scripts/enable_rls_security.py --verify 2>&1 | tee /tmp/rls_audit.log || {
            echo "## ❌ PostgreSQL Catalog Audit Gate Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/rls_audit.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          python scripts/audit_production_catalog_rls.py --ci-only 2>&1 | tee /tmp/prod_catalog_audit.log || {
            echo "## ❌ Production Catalog RLS Audit Gate Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/prod_catalog_audit.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload Test Results and Audit Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-logs-${{ github.sha }}
          path: |
            /tmp/test_results.log
            /tmp/upload_security_test_results.log
            /tmp/rls_audit.log
            /tmp/prod_catalog_audit.log
          retention-days: 7

      - name: Generate CTO P1 Security Gate Evidence Bundle Bound to Commit
        run: |
          set -o pipefail
          python scripts/generate_cto_p1_evidence_bundle.py 2>&1 | tee /tmp/bundle_generation.log || {
            echo "## ❌ Bundle Generation Error" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/bundle_generation.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload CTO Audit Evidence Bundle Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cto-p1-evidence-bundle-${{ github.sha }}
          path: |
            docs/audit/CTO_P1_SECURITY_GATE_EVIDENCE_BUNDLE.md
            docs/audit/ci_catalog_rls_report.json
            docs/audit/ci_catalog_rls_report.md
            /tmp/bundle_generation.log
          retention-days: 30