name: CTO P1 Security Gate Audit & Provenance Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-audit:
    name: Execute CTO Security Audit & Bind Evidence to Commit SHA
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: read

    steps:
      - name: Checkout Code at Exact Commit SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install --prefer-binary -r requirements.txt; fi
          pip install --no-deps aiogram==2.25.2
          pip install pytest pytest-asyncio pytest-cov

      - name: Verify Tested Commit SHA Provenance
        run: |
          echo "========================================================"
          echo "GITHUB_SHA (Commit Under Test): ${{ github.sha }}"
          echo "GIT REV-PARSE HEAD: $(git rev-parse HEAD)"
          echo "WORKING TREE STATUS: $(git status --porcelain)"
          echo "========================================================"

      - name: Initialize PostgreSQL Test Database Roles & RLS Schema
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST || '127.0.0.1' }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'postgres' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'test_ci_postgres_password' }}
        run: |
          python scripts/init_test_postgres_schema.py

      - name: Run Unit Tests for Security Gates, R2 Storage, HMAC Secret, Multi-Tenant RLS & Worker Isolation
        env:
          BOONTRACK_HMAC_SECRET: ${{ secrets.BOONTRACK_HMAC_SECRET || 'test_ci_secure_hmac_secret_for_pipeline_999' }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY || 'test_ci_evolution_api_key_placeholder' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || 'test_ci_r2_access_key' }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || 'test_ci_r2_secret_key' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || 'test-ci-r2-account' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST || '127.0.0.1' }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'postgres' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'test_ci_postgres_password' }}
        run: |
          set -o pipefail
          python -m pytest tests/test_r2_tenant_authorization.py tests/test_strict_hmac_secret.py tests/test_worker_cross_tenant_isolation.py tests/test_live_postgres_rls_security.py tests/test_e2e_core_inbox_integration.py tests/test_rls_tenants_commerce_carts_attributions.py -v -ra --tb=short 2>&1 | tee /tmp/test_results.log || {
            echo "## ❌ Pytest Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/test_results.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Execute PostgreSQL Catalog RLS & Security Invoker Audit Gate
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST || '127.0.0.1' }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'postgres' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'test_ci_postgres_password' }}
        run: |
          set -o pipefail
          python scripts/enable_rls_security.py 2>&1 | tee /tmp/rls_audit.log || {
            echo "## ❌ PostgreSQL Catalog Audit Gate Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/rls_audit.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload Test Results and Audit Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-logs-${{ github.sha }}
          path: |
            /tmp/test_results.log
            /tmp/rls_audit.log
          retention-days: 7

      - name: Generate CTO P1 Security Gate Evidence Bundle Bound to Commit
        env:
          BOONTRACK_HMAC_SECRET: ${{ secrets.BOONTRACK_HMAC_SECRET || 'test_ci_secure_hmac_secret_for_pipeline_999' }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY || 'test_ci_evolution_api_key_placeholder' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || 'test_ci_r2_access_key' }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || 'test_ci_r2_secret_key' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || 'test-ci-r2-account' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST || '127.0.0.1' }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'postgres' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'test_ci_postgres_password' }}
        run: |
          set -o pipefail
          python scripts/generate_cto_p1_evidence_bundle.py 2>&1 | tee /tmp/bundle_generation.log || {
            echo "## ❌ Bundle Generation Error" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/bundle_generation.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload CTO Audit Evidence Bundle Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cto-p1-evidence-bundle-${{ github.sha }}
          path: |
            docs/audit/CTO_P1_SECURITY_GATE_EVIDENCE_BUNDLE.md
            /tmp/bundle_generation.log
          retention-days: 30

