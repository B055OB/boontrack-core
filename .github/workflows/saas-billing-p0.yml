name: SaaS Billing P0 — Catalog and Team Scale

on:
  push:
    branches:
      - feat/core-saas-billing-contract-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saas-billing-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  saas-billing-p0:
    name: Verify SaaS catalog, legacy Team Scale, and targeted typing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      ENV: test
      ENVIRONMENT: test
      BOONTRACK_ENV: test
      TEST_STRICT_DB_GUARD: "1"
      TEST_REQUIRE_DISPOSABLE_SERVICES: "1"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_boontrack
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/test_boontrack
      STAGE1_TEST_DISPOSABLE_PG_DSN: postgresql://test_user:test_password@127.0.0.1:5432/bt_stage1_disposable_test_stage1
      STAGE3_STEP0_DISPOSABLE_PG_DSN: postgresql://test_user:test_password@127.0.0.1:5432/bt_stage1_disposable_test_step0
      STAGE3_STEP1_DISPOSABLE_PG_DSN: postgresql://test_user:test_password@127.0.0.1:5432/bt_stage1_disposable_test_step1
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_URL: redis://127.0.0.1:6379/0
      XENDIT_SECRET_KEY: test_ci_xendit_secret_key_mock_12345
      XENDIT_CALLBACK_TOKEN: test_ci_xendit_callback_token_mock_12345
      XENDIT_API_URL: http://127.0.0.1:58083
      XENDIT_ENV: sandbox
      SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPECTED_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_KEY: test_ci_supabase_anon_key_mock_999
      SUPABASE_ANON_KEY: test_ci_supabase_anon_key_mock_999
      SUPABASE_SERVICE_ROLE_KEY: test_ci_supabase_service_role_key_mock_999
      STAGING_DATABASE_URL: ""
      SUPABASE_DB_URL: ""
      REVOKED_STAGING_DB_PASSWORD: ""
      RESEND_API_KEY: ""
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      EMAIL_FROM: noreply@test.boontrack.invalid
      BOONTRACK_HMAC_SECRET: test_ci_secure_hmac_secret_for_pipeline_999
      LLM_PROVIDER: mock
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
      CI: "true"
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install pytest pytest-asyncio mypy

      - name: Start runner-local disposable PostgreSQL and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql redis-server
          sudo service postgresql start
          sudo service redis-server start
          sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='test_user'" | grep -q 1 || sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE test_user LOGIN PASSWORD 'test_password';"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE test_user WITH PASSWORD 'test_password';"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE test_user WITH SUPERUSER CREATEROLE;"
          sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='test_boontrack'" | grep -q 1 || sudo -u postgres createdb -O test_user test_boontrack
          python scripts/init_test_postgres_schema.py
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/038_core_saas_billing_contract_v1.sql
          redis-cli ping

      - name: Verify catalog and existing Team Scale regression tests
        run: |
          pytest -q tests/test_saas_billing_catalog.py tests/test_subscription_pricing.py tests/test_saas_billing_repository.py

      - name: Typecheck SaaS billing schema and catalog
        run: |
          mypy --follow-imports=silent --ignore-missing-imports app/schemas/saas_billing.py app/services/saas_billing_catalog.py app/services/saas_billing_repository.py
