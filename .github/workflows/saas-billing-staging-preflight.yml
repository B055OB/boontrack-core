name: SaaS Billing Staging Read-Only Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saas-billing-staging-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-read-only-preflight:
    name: Execute Staging Read-Only Preflight Check
    if: github.ref == 'refs/heads/feat/core-saas-billing-contract-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authorized branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimal dependencies for preflight
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Run Staging Read-Only Preflight
        env:
          SAAS_BILLING_STAGING_PREFLIGHT_DSN: ${{ secrets.SAAS_BILLING_STAGING_PREFLIGHT_DSN }}
        run: |
          python scripts/preflight_saas_billing_migration_038.py --staging-read-only
