version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: boontrack_postgres
    restart: always
    environment:
      POSTGRES_USER: boontrack_user
      POSTGRES_PASSWORD: boontrack_password
      POSTGRES_DB: boontrack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: boontrack_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://boontrack_user:boontrack_password@postgres:5432/boontrack_db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    ports:
      - "8000:8000"
    volumes:
      - bot_data:/app/data
    depends_on:
      - postgres

volumes:
  postgres_data:
  bot_data:
