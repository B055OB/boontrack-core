name: boontrack-test

services:
  test-postgres:
    image: postgres:15
    environment:
      COMPOSE_ISOLATED_ENV_FILE: "${COMPOSE_ISOLATED_ENV_FILE:?MUST PASS --env-file .env.test TO PREVENT HOST .env INTERPOLATION}"
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_boontrack
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_boontrack"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - test_internal_net

  test-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    environment:
      COMPOSE_ISOLATED_ENV_FILE: "${COMPOSE_ISOLATED_ENV_FILE:?MUST PASS --env-file .env.test TO PREVENT HOST .env INTERPOLATION}"
    tmpfs:
      - /data:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - test_internal_net

  test-runner:
    profiles: ["isolated-runner"]
    build:
      context: .
      dockerfile: Dockerfile.test
    working_dir: /workspace
    env_file:
      - .env.test
    environment:
      COMPOSE_ISOLATED_ENV_FILE: "${COMPOSE_ISOLATED_ENV_FILE:?MUST PASS --env-file .env.test TO PREVENT HOST .env INTERPOLATION}"
      APP_ENV: test
      ENV: test
      ENVIRONMENT: test
      BOONTRACK_ENV: test
      CI: "true"
      TEST_STRICT_DB_GUARD: "1"
      TEST_REQUIRE_DISPOSABLE_SERVICES: "1"
      TEST_IN_DOCKER_INTERNAL_NET: "1"
      ENABLE_LOCAL_REDIS: "true"
      POSTGRES_HOST: test-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_boontrack
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      DATABASE_URL: postgresql://test_user:test_password@test-postgres:5432/test_boontrack
      STAGE1_TEST_DISPOSABLE_PG_DSN: postgresql://test_user:test_password@test-postgres:5432/bt_stage1_disposable_test_stage1
      STAGE3_STEP0_DISPOSABLE_PG_DSN: postgresql://test_user:test_password@test-postgres:5432/bt_stage1_disposable_test_step0
      STAGE3_STEP1_DISPOSABLE_PG_DSN: postgresql://test_user:test_password@test-postgres:5432/bt_stage1_disposable_test_step1
      REDIS_HOST: test-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://test-redis:6379/0
      PYTHONDONTWRITEBYTECODE: "1"
    tmpfs:
      - /tmp/.pytest_cache:rw,nosuid,size=64m
      - /workspace/assets/uploads:rw,nosuid,size=128m
      - /workspace/docs/audit:rw,nosuid,size=32m
    depends_on:
      test-postgres:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    networks:
      - test_internal_net
    command: >
      sh -c "export TEST_ALLOWED_PG_CIDRS=$$(python -c 'import socket; print(socket.gethostbyname(\"test-postgres\") + \"/32\")') &&
             python scripts/init_test_postgres_schema.py &&
             python scripts/enable_rls_security.py --verify &&
             python scripts/audit_production_catalog_rls.py --ci-only &&
             python -m pytest -o cache_dir=/tmp/.pytest_cache -v -ra --tb=short
               tests/test_r2_tenant_authorization.py
               tests/test_strict_hmac_secret.py
               tests/test_worker_cross_tenant_isolation.py
               tests/test_live_postgres_rls_security.py
               tests/test_e2e_core_inbox_integration.py
               tests/test_rls_tenants_commerce_carts_attributions.py
               tests/test_fail_closed_config_entrypoints.py
               tests/test_contract_inbox_core_boundary.py
               tests/test_meta_webhook_verification.py
               tests/test_meta_webhook_p0_authentication.py
               tests/api/test_upload_security.py
               tests/api/test_aiohttp_upload_security.py
               tests/test_media_upload.py
               tests/api/test_upload_alias_authorization.py"

networks:
  test_internal_net:
    driver: bridge
    internal: true
